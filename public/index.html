<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Онлайн-доска для совместного рисования: открой ссылку и рисуй вместе.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Общая доска</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed dotted canvas; tool dock bottom-centre with a style bar above it; status top-left, view controls top-right */
:root {
  --bg: #f6f7f4; --dot: #c9cfc4; --fg: #1d2420; --muted: #67706a;
  --panel: #ffffff; --line: #dde2da; --hover: #eef1ec; --accent: #2f6f5e; --accent-fg: #ffffff; --sel: #2f6f5e;
  --ink: #1d2420; --red: #d2462f; --blue: #2c63c9; --green: #2f8a4a; --orange: #e08a1e; --violet: #7a4cc2;
  --note-yellow: #fbe9a0; --note-pink: #f8c9d2; --note-blue: #c6e0f5; --note-green: #cdeccb; --note-fg: #2a2a22;
  --warn-bg: #fff4d6; --warn-fg: #6b4a00;
  --shadow: 0 6px 24px rgba(30,40,34,.14), 0 1px 3px rgba(30,40,34,.08);
  --f-ui: "Figtree", system-ui, sans-serif; --f-hand: "Caveat", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171b19; --dot: #303733; --fg: #e7ebe6; --muted: #98a19a;
  --panel: #222825; --line: #353d38; --hover: #2c332f; --accent: #6cc3a6; --accent-fg: #0f1a15; --sel: #6cc3a6;
  --ink: #eef1ec; --red: #ff7a62; --blue: #79a6ff; --green: #6ed38a; --orange: #ffb04d; --violet: #b996ff;
  --note-yellow: #e9d27c; --note-pink: #e6a7b4; --note-blue: #9fc4e3; --note-green: #a9d6a6; --note-fg: #1d1d17;
  --warn-bg: #3a3220; --warn-fg: #f3d58c;
  --shadow: 0 6px 24px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #171b19; --dot: #303733; --fg: #e7ebe6; --muted: #98a19a;
  --panel: #222825; --line: #353d38; --hover: #2c332f; --accent: #6cc3a6; --accent-fg: #0f1a15; --sel: #6cc3a6;
  --ink: #eef1ec; --red: #ff7a62; --blue: #79a6ff; --green: #6ed38a; --orange: #ffb04d; --violet: #b996ff;
  --note-yellow: #e9d27c; --note-pink: #e6a7b4; --note-blue: #9fc4e3; --note-green: #a9d6a6; --note-fg: #1d1d17;
  --warn-bg: #3a3220; --warn-fg: #f3d58c;
  --shadow: 0 6px 24px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3); color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
#stage { position: fixed; inset: 0; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#dom { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.it { position: absolute; box-sizing: border-box; white-space: pre-wrap; overflow-wrap: anywhere; cursor: grab; }
.note { width: 190px; min-height: 130px; padding: 14px 16px 16px; font: 600 25px/1.1 var(--f-hand); color: var(--note-fg);
  border-radius: 2px 2px 14px 2px; box-shadow: var(--shadow); }
.note[data-c="yellow"] { background: var(--note-yellow); } .note[data-c="pink"] { background: var(--note-pink); }
.note[data-c="blue"] { background: var(--note-blue); } .note[data-c="green"] { background: var(--note-green); }
.txt { min-width: 40px; padding: 2px 4px; font: 600 34px/1.1 var(--f-hand); max-width: 640px; }
.txt[data-c="ink"] { color: var(--ink); } .txt[data-c="red"] { color: var(--red); } .txt[data-c="blue"] { color: var(--blue); }
.txt[data-c="green"] { color: var(--green); } .txt[data-c="orange"] { color: var(--orange); } .txt[data-c="violet"] { color: var(--violet); }
.txt[data-s="S"] { font-size: 24px; } .txt[data-s="L"] { font-size: 54px; }
.it.editing { cursor: text; -webkit-user-select: text; user-select: text; outline: 2px solid var(--sel); outline-offset: 2px; }
.it.selected { outline: 2px dashed var(--sel); outline-offset: 4px; }
.note:empty::before { content: "Двойной клик — написать"; opacity: .45; font-size: 21px; }
.txt:empty::before { content: "Текст"; opacity: .4; }
.it.editing:empty::before { content: ""; }
.it.local::after { content: "только у вас"; position: absolute; left: 0; bottom: -20px; font: 500 11px var(--f-ui); color: var(--muted); white-space: nowrap; }
#cursors { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.cur { position: absolute; left: 0; top: 0; transition: transform .08s linear; }
.cur svg { display: block; }
.cur span { position: absolute; left: 14px; top: 16px; font: 600 12px var(--f-ui); padding: 2px 7px; border-radius: 9px; color: #fff; white-space: nowrap; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.bar { position: fixed; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 5px; max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none; }
.bar::-webkit-scrollbar { display: none; }
#dock { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
#style { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); border-radius: 12px; padding: 4px; }
button { font: inherit; color: inherit; }
.bar button, .tb button { flex: none; height: 38px; min-width: 38px; border: 0; border-radius: 9px; background: none; color: var(--fg);
  font: 600 13px var(--f-ui); cursor: pointer; display: grid; place-items: center; padding: 0 8px; position: relative; }
#style button { height: 32px; min-width: 32px; }
.bar button:hover, .tb button:hover { background: var(--hover); }
.bar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.bar button:disabled, .tb button:disabled { opacity: .35; cursor: default; background: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; flex: none; }
.sw { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(127,127,127,.3); }
#style button.on { background: var(--hover); }
#style button.on .sw { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
#style button.on.sz { color: var(--accent); background: var(--hover); }
.szdot { border-radius: 50%; background: currentColor; }
.bar svg, .tb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
kbd { position: absolute; right: 3px; bottom: 1px; font: 500 9px var(--f-ui); opacity: .5; }
@media (hover: none), (max-width: 640px) { kbd { display: none; } }

.top { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.top > * { pointer-events: auto; }
.chip { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 13px; min-width: 0; }
.chip b { font-weight: 600; white-space: nowrap; } .chip .m { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dotst { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dotst.on { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); }
.dotst.ro { background: var(--orange); }
.faces { display: flex; flex: none; }
.face { width: 24px; height: 24px; border-radius: 50%; color: #fff; font: 600 11px/24px var(--f-ui); text-align: center; margin-left: -6px; border: 2px solid var(--panel); }
.face:first-child { margin-left: 0; }
.tb { display: flex; align-items: center; gap: 2px; padding: 4px; flex: none; }
.tb button { height: 32px; min-width: 32px; }
#zoomLbl { min-width: 52px; font-variant-numeric: tabular-nums; }
.danger { background: var(--red) !important; color: #fff !important; }
.notice { position: fixed; top: calc(62px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  max-width: min(420px, calc(100vw - 32px)); background: var(--warn-bg); color: var(--warn-fg); border-radius: 12px; padding: 10px 34px 10px 14px;
  font-size: 13px; line-height: 1.45; box-shadow: var(--shadow); }
.notice b { font-weight: 600; }
.notice .close { position: absolute; top: 6px; right: 6px; border: 0; background: none; cursor: pointer; font-size: 16px; color: inherit; width: 24px; height: 24px; border-radius: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(124px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg);
  padding: 8px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); pointer-events: none; }
.hint { position: fixed; left: 50%; top: 42%; transform: translate(-50%,-50%); text-align: center; color: var(--muted); pointer-events: none; max-width: calc(100vw - 32px); }
.hint h2 { font: 700 44px/1 var(--f-hand); color: var(--fg); margin: 0 0 8px; opacity: .8; }
.hint p { margin: 0; font-size: 14px; line-height: 1.5; }
[hidden] { display: none !important; }
.top > .chip { flex: 0 1 auto; }
@media (max-width: 420px) { .chip b { display: none; } }
@media (max-width: 560px) { .chip .m { display: none; } #zoomOut, #zoomIn, #zoomLbl, .tb .sep { display: none; } #shareBtn span, #exportBtn span { display: none; } .hint h2 { font-size: 36px; } }
@media (prefers-reduced-motion: reduce) { .cur { transition: none; } }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { margin: 0; font-size: 14px; }
.namebox { display: flex; align-items: center; gap: 6px; }
.namebox input { width: 120px; height: 28px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; background: var(--bg); color: var(--fg); font: 500 13px var(--f-ui); }
.namebox input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
#shareBtn { background: var(--accent); color: var(--accent-fg); padding: 0 12px; gap: 6px; display: flex; }
#shareBtn:hover { background: var(--accent); filter: brightness(1.08); }
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="dom"></div>
  <div id="cursors"></div>
</div>

<div class="hint" id="hint" hidden>
  <h2>Доска пуста</h2>
  <p>Выберите карандаш, фигуру или стикер внизу и начните.<br>Всё сохраняется само.</p>
</div>

<div class="top">
  <div class="chip panel"><span class="dotst" id="st"></span><b>Общая доска</b><span class="m" id="stText">подключение…</span><span class="faces" id="faces"></span><button type="button" id="nameBtn" class="namebtn" title="Изменить имя" style="border:0;background:none;cursor:pointer;color:var(--muted);font:500 13px var(--f-ui);padding:0">✎</button></div>
  <div class="tb panel" id="viewBar">
    <button type="button" id="zoomOut" title="Отдалить (−)" aria-label="Отдалить"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button type="button" id="zoomLbl" title="Сбросить масштаб до 100%">100%</button>
    <button type="button" id="zoomIn" title="Приблизить (+)" aria-label="Приблизить"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    <button type="button" id="fitBtn" title="Показать всё (F)" aria-label="Показать всё"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <span class="sep"></span>
    <button type="button" id="shareBtn" title="Скопировать ссылку на доску"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 006 0l3-3a4 4 0 00-6-6l-1 1"/><path d="M14 10a4 4 0 00-6 0l-3 3a4 4 0 006 6l1-1"/></svg><span>Пригласить</span></button>
    <button type="button" id="exportBtn" title="Скачать PNG"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    <span id="clearBox"></span>
  </div>
</div>

<div class="notice" id="notice" hidden></div>

<div class="bar panel" id="style" role="toolbar" aria-label="Цвет и толщина"></div>

<div class="bar panel" id="dock" role="toolbar" aria-label="Инструменты">
  <button type="button" data-tool="select" title="Выбор и перемещение (V)" aria-label="Выбор"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg><kbd>V</kbd></button>
  <button type="button" data-tool="pen" title="Карандаш (P)" aria-label="Карандаш"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg><kbd>P</kbd></button>
  <button type="button" data-tool="marker" title="Маркер-выделитель (M)" aria-label="Маркер"><svg viewBox="0 0 24 24"><path d="M9 14l-3 6h6l1-3"/><path d="M9 14l7-10 4 3-7 10z"/></svg><kbd>M</kbd></button>
  <button type="button" data-tool="line" title="Линия (L)" aria-label="Линия"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg><kbd>L</kbd></button>
  <button type="button" data-tool="arrow" title="Стрелка (A)" aria-label="Стрелка"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg><kbd>A</kbd></button>
  <button type="button" data-tool="rect" title="Прямоугольник (R)" aria-label="Прямоугольник"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg><kbd>R</kbd></button>
  <button type="button" data-tool="ellipse" title="Эллипс (O)" aria-label="Эллипс"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg><kbd>O</kbd></button>
  <button type="button" data-tool="text" title="Текст (T)" aria-label="Текст"><svg viewBox="0 0 24 24"><path d="M5 6V5h14v1M12 5v14M9 19h6"/></svg><kbd>T</kbd></button>
  <button type="button" data-tool="note" title="Стикер (N)" aria-label="Стикер"><svg viewBox="0 0 24 24"><path d="M5 4h14v10l-6 6H5z"/><path d="M13 20v-6h6"/></svg><kbd>N</kbd></button>
  <button type="button" data-tool="erase" title="Ластик (E)" aria-label="Ластик"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M5 15l9-9 5 5-8 9H9z"/></svg><kbd>E</kbd></button>
  <button type="button" data-tool="pan" title="Рука (H или пробел)" aria-label="Рука"><svg viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 013 0V12M11 11V4.5a1.5 1.5 0 013 0V12M14 11V6.5a1.5 1.5 0 013 0V14c0 4-2.5 7-6 7-2.5 0-4-1.2-5.5-3.5L4 14.5a1.5 1.5 0 012.5-1.6L8 15"/></svg><kbd>H</kbd></button>
  <span class="sep"></span>
  <button type="button" id="undoBtn" title="Отменить (Ctrl+Z)" aria-label="Отменить" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
  <button type="button" id="redoBtn" title="Повторить (Ctrl+Shift+Z)" aria-label="Повторить" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
</div>

<script>
(() => {
"use strict";
const INKS = ["ink", "red", "blue", "green", "orange", "violet"];
const NOTE_COLORS = ["yellow", "pink", "blue", "green"];
const SIZES = { S: 2, M: 4, L: 9 };
const PEER_COLORS = ["#d2462f", "#2c63c9", "#2f8a4a", "#b0569e", "#e08a1e", "#1c8a8a"];
const DRAW_TOOLS = ["pen", "marker", "line", "arrow", "rect", "ellipse", "text"];
const SHAPES = ["line", "arrow", "rect", "ellipse"];
const DOM_KINDS = ["note", "text"];
const LS_KEY = "board.personal.v1";

const $ = id => document.getElementById(id);
const stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d"), domEl = $("dom"), cursorsEl = $("cursors");
let tool = "pen", ink = "ink", noteColor = "yellow", size = "M";
let view = { x: 0, y: 0, z: 1 };
const shared = new Map();   // id -> item from db
const local = new Map();    // id -> personal item (browser only), ids start with "L"
let col = null, room = null, user = null, myId = null;
let mode = "connecting";    // connecting | shared | personal
let draft = null, selected = null, drag = null;
const undoStack = [], redoStack = [];
const css = n => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();
const allItems = () => { const m = new Map(shared); for (const [k, v] of local) m.set(k, v); return m; };
const getItem = id => shared.get(id) || local.get(id);
const isLocal = id => id.startsWith("L");
const canTouch = id => mode !== "connecting";

function saveLocal() {}

/* ---------- toolbar ---------- */
const styleBar = $("style");
function renderStyleBar() {
  const isNote = tool === "note";
  const show = isNote || DRAW_TOOLS.includes(tool);
  styleBar.hidden = !show;
  if (!show) return;
  styleBar.innerHTML = "";
  (isNote ? NOTE_COLORS : INKS).forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-label", "Цвет " + c);
    b.className = (isNote ? noteColor : ink) === c ? "on" : "";
    b.innerHTML = `<span class="sw" style="background:var(--${isNote ? "note-" + c : c})"></span>`;
    b.onclick = () => { if (isNote) noteColor = c; else ink = c; restyleSelected(); renderStyleBar(); };
    styleBar.appendChild(b);
  });
  if (!isNote) {
    const s = document.createElement("span"); s.className = "sep"; styleBar.appendChild(s);
    Object.keys(SIZES).forEach(k => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "sz" + (size === k ? " on" : ""); b.title = { S: "Тонкая", M: "Средняя", L: "Толстая" }[k];
      b.setAttribute("aria-label", b.title);
      const d = { S: 4, M: 7, L: 11 }[k];
      b.innerHTML = `<span class="szdot" style="width:${d}px;height:${d}px"></span>`;
      b.onclick = () => { size = k; restyleSelected(); renderStyleBar(); };
      styleBar.appendChild(b);
    });
  }
}
function setTool(t) {
  tool = t;
  if (t !== "select") select(null);
  document.querySelectorAll("[data-tool]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tool === t)));
  stage.style.cursor = { pan: "grab", select: "default", note: "copy", text: "text", erase: "cell" }[t] || "crosshair";
  renderStyleBar();
}
document.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));

/* ---------- geometry ---------- */
const toWorld = (cx, cy) => ({ x: (cx - view.x) / view.z, y: (cy - view.y) / view.z });
const r1 = v => Math.round(v * 10) / 10;
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function hit(it, x, y, tol) {
  const t = tol + (it.w || 0) / 2;
  if (it.kind === "stroke") {
    const p = it.p;
    if (p.length === 2) return Math.hypot(p[0] - x, p[1] - y) < t;
    for (let i = 0; i < p.length - 2; i += 2) if (segDist(x, y, p[i], p[i + 1], p[i + 2], p[i + 3]) < t) return true;
    return false;
  }
  if (it.kind === "line" || it.kind === "arrow") return segDist(x, y, it.x1, it.y1, it.x2, it.y2) < t;
  if (it.kind === "rect") {
    const { x1, y1, x2, y2 } = it;
    return segDist(x, y, x1, y1, x2, y1) < t || segDist(x, y, x2, y1, x2, y2) < t || segDist(x, y, x2, y2, x1, y2) < t || segDist(x, y, x1, y2, x1, y1) < t;
  }
  if (it.kind === "ellipse") {
    const cx = (it.x1 + it.x2) / 2, cy = (it.y1 + it.y2) / 2, rx = Math.abs(it.x2 - it.x1) / 2 || 1, ry = Math.abs(it.y2 - it.y1) / 2 || 1;
    const d = Math.hypot((x - cx) / rx, (y - cy) / ry);
    return Math.abs(d - 1) * Math.min(rx, ry) < t;
  }
  return false;
}
function bbox(it) {
  if (it.kind === "stroke") {
    let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
    for (let i = 0; i < it.p.length; i += 2) { a = Math.min(a, it.p[i]); b = Math.min(b, it.p[i + 1]); c = Math.max(c, it.p[i]); d = Math.max(d, it.p[i + 1]); }

  } else $("clearBtn").onclick = () => renderClear(true);
}

/* ---------- keys ---------- */
addEventListener("keydown", e => {
  if (e.target.isContentEditable) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === "y") { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "Space") { if (!spaceDown) { spaceDown = true; stage.style.cursor = "grab"; } e.preventDefault(); return; }
  if ((k === "delete" || k === "backspace") && selected && canTouch(selected)) { removeItem(selected, true); return; }
  if (k === "escape") { select(null); return; }
  if (k === "enter" && selected) { const el = domEl.querySelector(`[data-id="${CSS.escape(selected)}"]`); if (el) { e.preventDefault(); editDom(el); } return; }
  if (k === "+" || k === "=") { zoomAt(innerWidth / 2, innerHeight / 2, view.z * 1.25); return; }
  if (k === "-") { zoomAt(innerWidth / 2, innerHeight / 2, view.z / 1.25); return; }
  if (k === "f") { fit(); return; }
  const m = { v: "select", p: "pen", m: "marker", l: "line", a: "arrow", r: "rect", o: "ellipse", t: "text", n: "note", e: "erase", h: "pan" }[k];
  if (m) setTool(m);
});
addEventListener("keyup", e => { if (e.code === "Space") { spaceDown = false; setTool(tool); } });

/* ---------- status, presence, connection ---------- */
const stEl = $("st"), stText = $("stText"), facesEl = $("faces"), noticeEl = $("notice");
let toastT = 0;
function toast(msg) {
  let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600);
}
function setStatus() {
  const others = peers.filter(p => p.peer !== myPeer).length;
  stEl.className = "dotst" + (mode === "shared" ? " on" : mode === "offline" ? " ro" : "");
  stText.textContent = mode === "connecting" ? "подключение…"
    : mode === "offline" ? "нет связи, переподключаюсь…"
    : (others ? `ещё ${others} на доске` : "сохраняется автоматически");
}
let peers = [], cursors = new Map(), myPeer = null, lastSend = 0;
function sendCursor(e) {
  const now = performance.now(); if (now - lastSend < 50) return; lastSend = now;
  const w = toWorld(e.clientX, e.clientY);
  send({ type: "cursor", cur: { x: Math.round(w.x), y: Math.round(w.y) } });
}
function renderPeers() {
  facesEl.innerHTML = "";
  peers.slice(0, 6).forEach(p => {
    const f = document.createElement("span"); f.className = "face"; f.style.background = p.color;
    const me = p.peer === myPeer;
    f.textContent = (p.name || "?").trim().charAt(0).toUpperCase() || "?"; f.title = me ? p.name + " (вы)" : p.name;
    facesEl.appendChild(f);
  });
  for (const id of cursors.keys()) if (!peers.some(p => p.peer === id)) cursors.delete(id);
  setStatus(); renderCursors();
}
function renderCursors() {
  const seen = new Set();
  for (const p of peers) {
    const cur = cursors.get(p.peer);
    if (p.peer === myPeer || !cur) continue;
    seen.add(p.peer);
    let el = cursorsEl.querySelector(`[data-p="${CSS.escape(p.peer)}"]`);
    if (!el) {
      el = document.createElement("div"); el.className = "cur"; el.dataset.p = p.peer;
      el.innerHTML = `<svg width="16" height="20" viewBox="0 0 16 20"><path d="M1 1l13 10-6 1-3 6z" stroke="#fff" stroke-width="1.5"/></svg><span></span>`;
      cursorsEl.appendChild(el);
    }
    el.querySelector("path").setAttribute("fill", p.color);
    const sp = el.querySelector("span"); sp.style.background = p.color; sp.textContent = p.name || "Гость";
    el.style.transform = `translate(${cur.x * view.z + view.x}px,${cur.y * view.z + view.y}px)`;
  }
  cursorsEl.querySelectorAll(".cur").forEach(el => { if (!seen.has(el.dataset.p)) el.remove(); });
}

/* name */
const NAME_KEY = "board.name";
let myName = "";
try { myName = localStorage.getItem(NAME_KEY) || ""; } catch {}
if (!myName) myName = "Гость " + Math.floor(100 + Math.random() * 900);
$("nameBtn").onclick = () => {
  const box = document.createElement("span"); box.className = "namebox";
  box.innerHTML = `<input id="nameInput" maxlength="32" aria-label="Ваше имя">`;
  const btn = $("nameBtn"); btn.hidden = true; btn.after(box);
  const inp = box.querySelector("input"); inp.value = myName; inp.focus(); inp.select();
  const done = () => {
    const v = inp.value.trim().slice(0, 32);
    if (v) { myName = v; try { localStorage.setItem(NAME_KEY, v); } catch {} send({ type: "name", name: v }); }
    box.remove(); btn.hidden = false;
  };
  inp.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") done(); if (e.key === "Escape") { box.remove(); btn.hidden = false; } });
  inp.addEventListener("blur", done);
};

/* share */
$("shareBtn").onclick = async () => {
  const link = location.href.split("#")[0];
  try { await navigator.clipboard.writeText(link); toast("Ссылка скопирована. Отправьте её тем, с кем хотите рисовать."); }
  catch { prompt("Скопируйте ссылку на доску:", link); }
};

/* connection */
const boardId = (location.pathname.match(/\/b\/([A-Za-z0-9_-]+)/) || [])[1] || "demo";
let ws = null, retry = 0;
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws?board=${encodeURIComponent(boardId)}&name=${encodeURIComponent(myName)}`);
  ws.onopen = () => { retry = 0; };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === "init") {
      const first = mode === "connecting";
      myPeer = m.you; shared.clear();
      for (const [k, v] of Object.entries(m.items || {})) shared.set(k, v);
      peers = m.peers || []; mode = "shared"; renderClear(false);
      renderDom(); draw(); renderPeers();
      if (first) fit();
    } else if (m.type === "set") { if (!(drag && drag.id === m.id)) { shared.set(m.id, m.data); renderDom(); draw(); } }
    else if (m.type === "del") { shared.delete(m.id); if (selected === m.id) selected = null; renderDom(); draw(); }
    else if (m.type === "clear") { shared.clear(); selected = null; renderDom(); draw(); }
    else if (m.type === "peers") { peers = m.peers || []; renderPeers(); }
    else if (m.type === "cursor") { if (m.cur) cursors.set(m.peer, m.cur); else cursors.delete(m.peer); renderCursors(); }
    else if (m.type === "error") toast(m.message || "Ошибка сервера");
  };
  ws.onclose = () => {
    if (mode !== "connecting") mode = "offline";
    setStatus();
    setTimeout(connect, Math.min(10000, 500 * 2 ** retry++));
  };
}

/* ---------- boot ---------- */
setTool("pen"); renderClear(false); syncUndo();
view = { x: innerWidth / 2, y: innerHeight / 2, z: 1 };
resize(); renderDom(); setStatus();
connect();
})();
</script>
</body>
