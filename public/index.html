<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Онлайн-доска для совместного рисования: открой ссылку и рисуй вместе.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f5e'/%3E%3Cpath d='M8 22c3-8 6-11 8-6s5 2 8-6' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Общая доска</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed dotted canvas; tool dock bottom-centre with a style bar above it; status top-left, view controls top-right */
:root {
  --bg: #f6f7f4; --dot: #c9cfc4; --fg: #1d2420; --muted: #67706a;
  --panel: #ffffff; --line: #dde2da; --hover: #eef1ec; --accent: #2f6f5e; --accent-fg: #ffffff; --sel: #2f6f5e;
  --ink: #1d2420; --red: #d2462f; --blue: #2c63c9; --green: #2f8a4a; --orange: #e08a1e; --violet: #7a4cc2;
  --note-yellow: #fbe9a0; --note-pink: #f8c9d2; --note-blue: #c6e0f5; --note-green: #cdeccb; --note-fg: #2a2a22;
  --shadow: 0 6px 24px rgba(30,40,34,.14), 0 1px 3px rgba(30,40,34,.08);
  --f-ui: "Figtree", system-ui, sans-serif; --f-hand: "Caveat", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171b19; --dot: #303733; --fg: #e7ebe6; --muted: #98a19a;
  --panel: #222825; --line: #353d38; --hover: #2c332f; --accent: #6cc3a6; --accent-fg: #0f1a15; --sel: #6cc3a6;
  --ink: #eef1ec; --red: #ff7a62; --blue: #79a6ff; --green: #6ed38a; --orange: #ffb04d; --violet: #b996ff;
  --note-yellow: #e9d27c; --note-pink: #e6a7b4; --note-blue: #9fc4e3; --note-green: #a9d6a6; --note-fg: #1d1d17;
  --shadow: 0 6px 24px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #171b19; --dot: #303733; --fg: #e7ebe6; --muted: #98a19a;
  --panel: #222825; --line: #353d38; --hover: #2c332f; --accent: #6cc3a6; --accent-fg: #0f1a15; --sel: #6cc3a6;
  --ink: #eef1ec; --red: #ff7a62; --blue: #79a6ff; --green: #6ed38a; --orange: #ffb04d; --violet: #b996ff;
  --note-yellow: #e9d27c; --note-pink: #e6a7b4; --note-blue: #9fc4e3; --note-green: #a9d6a6; --note-fg: #1d1d17;
  --shadow: 0 6px 24px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3); color-scheme: dark; }
html, body { height: 100%; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { margin: 0; font-size: 14px; background: var(--bg); color: var(--fg); font-family: var(--f-ui); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
[hidden] { display: none !important; }
#stage { position: fixed; inset: 0; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#dom { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.it { position: absolute; box-sizing: border-box; white-space: pre-wrap; overflow-wrap: anywhere; cursor: grab; }
.note { width: 190px; min-height: 130px; padding: 14px 16px 16px; font: 600 25px/1.1 var(--f-hand); color: var(--note-fg);
  border-radius: 2px 2px 14px 2px; box-shadow: var(--shadow); }
.note[data-c="yellow"] { background: var(--note-yellow); } .note[data-c="pink"] { background: var(--note-pink); }
.note[data-c="blue"] { background: var(--note-blue); } .note[data-c="green"] { background: var(--note-green); }
.txt { min-width: 40px; padding: 2px 4px; font: 600 34px/1.1 var(--f-hand); max-width: 640px; }
.txt[data-c="ink"] { color: var(--ink); } .txt[data-c="red"] { color: var(--red); } .txt[data-c="blue"] { color: var(--blue); }
.txt[data-c="green"] { color: var(--green); } .txt[data-c="orange"] { color: var(--orange); } .txt[data-c="violet"] { color: var(--violet); }
.txt[data-s="S"] { font-size: 24px; } .txt[data-s="L"] { font-size: 54px; }
.it.editing { cursor: text; -webkit-user-select: text; user-select: text; outline: 2px solid var(--sel); outline-offset: 2px; }
.it.selected { outline: 2px dashed var(--sel); outline-offset: 4px; }
.note:empty::before { content: "Двойной клик — написать"; opacity: .45; font-size: 21px; }
.txt:empty::before { content: "Текст"; opacity: .4; }
.it.editing:empty::before { content: ""; }
#cursors { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.cur { position: absolute; left: 0; top: 0; transition: transform .09s linear; will-change: transform; }
.cur svg { display: block; }
.cur span { position: absolute; left: 14px; top: 16px; font: 600 12px var(--f-ui); padding: 2px 7px; border-radius: 9px; color: #fff; white-space: nowrap; }
.seldel { position: fixed; left: 0; top: 0; z-index: 5; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--panel); color: var(--red); box-shadow: var(--shadow); cursor: pointer; display: grid; place-items: center; padding: 0; }
.seldel svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.seldel:hover { background: var(--hover); }
.drop { position: fixed; inset: 10px; border: 3px dashed var(--accent); border-radius: 18px; background: color-mix(in srgb, var(--accent) 8%, transparent);
  display: grid; place-items: center; font: 700 40px var(--f-hand); color: var(--accent); pointer-events: none; z-index: 20; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.bar { position: fixed; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 5px; max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none; }
.bar::-webkit-scrollbar { display: none; }
#dock { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
#style { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); border-radius: 12px; padding: 4px; }
button { font: inherit; color: inherit; }
.bar button, .tb button { flex: none; height: 38px; min-width: 38px; border: 0; border-radius: 9px; background: none; color: var(--fg);
  font: 600 13px var(--f-ui); cursor: pointer; display: grid; place-items: center; padding: 0 8px; position: relative; }
#style button { height: 32px; min-width: 32px; }
.bar button:hover, .tb button:hover { background: var(--hover); }
.bar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.bar button:disabled, .tb button:disabled { opacity: .35; cursor: default; background: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; flex: none; }
.sw { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(127,127,127,.3); }
#style button.on { background: var(--hover); }
#style button.on .sw { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
#style button.on.sz { color: var(--accent); background: var(--hover); }
.szdot { border-radius: 50%; background: currentColor; }
.bar svg, .tb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
kbd { position: absolute; right: 3px; bottom: 1px; font: 500 9px var(--f-ui); opacity: .5; }
@media (hover: none), (max-width: 640px) { kbd { display: none; } }

.top { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.top > * { pointer-events: auto; }
.chip { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 13px; min-width: 0; flex: 0 1 auto; }
.chip b { font-weight: 600; white-space: nowrap; } .chip .m { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dotst { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dotst.on { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); }
.dotst.ro { background: var(--orange); }
.faces { display: flex; flex: none; }
.face { width: 24px; height: 24px; border-radius: 50%; color: #fff; font: 600 11px/24px var(--f-ui); text-align: center; margin-left: -6px; border: 2px solid var(--panel); }
.face:first-child { margin-left: 0; }
.namebtn { border: 0; background: none; cursor: pointer; color: var(--muted); font: 500 13px var(--f-ui); padding: 0; }
.namebox { display: flex; align-items: center; gap: 6px; }
.namebox input { width: 120px; height: 28px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; background: var(--bg); color: var(--fg); font: 500 13px var(--f-ui); }
.namebox input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.tb { display: flex; align-items: center; gap: 2px; padding: 4px; flex: none; }
.tb button { height: 32px; min-width: 32px; }
#zoomLbl { min-width: 52px; font-variant-numeric: tabular-nums; }
#shareBtn { background: var(--accent); color: var(--accent-fg); padding: 0 12px; gap: 6px; display: flex; }
#shareBtn:hover { background: var(--accent); filter: brightness(1.08); }
.danger { background: var(--red) !important; color: #fff !important; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(124px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg);
  padding: 8px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); pointer-events: none; z-index: 30; max-width: calc(100vw - 32px); text-align: center; }
.hint { position: fixed; left: 50%; top: 42%; transform: translate(-50%,-50%); text-align: center; color: var(--muted); pointer-events: none; max-width: calc(100vw - 32px); }
.hint h2 { font: 700 44px/1 var(--f-hand); color: var(--fg); margin: 0 0 8px; opacity: .8; }
.hint p { margin: 0; font-size: 14px; line-height: 1.6; }
@media (max-width: 420px) { .chip b { display: none; } }
@media (max-width: 560px) { .chip .m { display: none; } #zoomOut, #zoomIn, #zoomLbl, .tb .sep { display: none; } #shareBtn span { display: none; } .hint h2 { font-size: 36px; } }
@media (prefers-reduced-motion: reduce) { .cur { transition: none; } }
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="dom"></div>
  <div id="cursors"></div>
</div>
<button type="button" class="seldel" id="selDel" title="Удалить (Delete)" aria-label="Удалить выделенное" hidden><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>
<div class="drop" id="drop" hidden>Отпустите, чтобы вставить картинку</div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>

<div class="hint" id="hint" hidden>
  <h2>Доска пуста</h2>
  <p>Рисуйте, ставьте стикеры или вставьте картинку: Ctrl+V или перетащите файл.<br>Правая кнопка мыши двигает доску, колёсико прокручивает.</p>
</div>

<div class="top">
  <div class="chip panel"><span class="dotst" id="st"></span><b>Общая доска</b><span class="m" id="stText">подключение…</span><span class="faces" id="faces"></span><button type="button" id="nameBtn" class="namebtn" title="Изменить имя" aria-label="Изменить имя">✎</button></div>
  <div class="tb panel" id="viewBar">
    <button type="button" id="zoomOut" title="Отдалить (−)" aria-label="Отдалить"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button type="button" id="zoomLbl" title="Сбросить масштаб до 100%">100%</button>
    <button type="button" id="zoomIn" title="Приблизить (+)" aria-label="Приблизить"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    <button type="button" id="fitBtn" title="Показать всё (F)" aria-label="Показать всё"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <span class="sep"></span>
    <button type="button" id="shareBtn" title="Скопировать ссылку на доску"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 006 0l3-3a4 4 0 00-6-6l-1 1"/><path d="M14 10a4 4 0 00-6 0l-3 3a4 4 0 006 6l1-1"/></svg><span>Пригласить</span></button>
    <button type="button" id="exportBtn" title="Скачать PNG" aria-label="Скачать PNG"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    <span id="clearBox" style="display:contents"></span>
  </div>
</div>

<div class="bar panel" id="style" role="toolbar" aria-label="Цвет и толщина"></div>

<div class="bar panel" id="dock" role="toolbar" aria-label="Инструменты">
  <button type="button" data-tool="select" title="Выбор и перемещение (V)" aria-label="Выбор"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg><kbd>V</kbd></button>
  <button type="button" data-tool="pen" title="Карандаш (P). С Shift — прямая линия" aria-label="Карандаш"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg><kbd>P</kbd></button>
  <button type="button" data-tool="marker" title="Маркер-выделитель (M). С Shift — прямая линия" aria-label="Маркер"><svg viewBox="0 0 24 24"><path d="M9 14l-3 6h6l1-3"/><path d="M9 14l7-10 4 3-7 10z"/></svg><kbd>M</kbd></button>
  <button type="button" data-tool="line" title="Линия (L)" aria-label="Линия"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg><kbd>L</kbd></button>
  <button type="button" data-tool="arrow" title="Стрелка (A)" aria-label="Стрелка"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg><kbd>A</kbd></button>
  <button type="button" data-tool="rect" title="Прямоугольник (R)" aria-label="Прямоугольник"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg><kbd>R</kbd></button>
  <button type="button" data-tool="ellipse" title="Эллипс (O)" aria-label="Эллипс"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg><kbd>O</kbd></button>
  <button type="button" data-tool="text" title="Текст (T)" aria-label="Текст"><svg viewBox="0 0 24 24"><path d="M5 6V5h14v1M12 5v14M9 19h6"/></svg><kbd>T</kbd></button>
  <button type="button" data-tool="note" title="Стикер (N)" aria-label="Стикер"><svg viewBox="0 0 24 24"><path d="M5 4h14v10l-6 6H5z"/><path d="M13 20v-6h6"/></svg><kbd>N</kbd></button>
  <button type="button" id="imgBtn" title="Картинка (I), или Ctrl+V, или перетащите файл" aria-label="Вставить картинку"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l5-5 4 4 2-2 3.5 3.5"/></svg><kbd>I</kbd></button>
  <button type="button" data-tool="erase" title="Ластик (E)" aria-label="Ластик"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M5 15l9-9 5 5-8 9H9z"/></svg><kbd>E</kbd></button>
  <button type="button" data-tool="pan" title="Рука (H, пробел или правая кнопка мыши)" aria-label="Рука"><svg viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 013 0V12M11 11V4.5a1.5 1.5 0 013 0V12M14 11V6.5a1.5 1.5 0 013 0V14c0 4-2.5 7-6 7-2.5 0-4-1.2-5.5-3.5L4 14.5a1.5 1.5 0 012.5-1.6L8 15"/></svg><kbd>H</kbd></button>
  <span class="sep"></span>
  <button type="button" id="undoBtn" title="Отменить (Ctrl+Z)" aria-label="Отменить" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
  <button type="button" id="redoBtn" title="Повторить (Ctrl+Shift+Z)" aria-label="Повторить" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
</div>

<script>
(() => {
"use strict";
const INKS = ["ink", "red", "blue", "green", "orange", "violet"];
const NOTE_COLORS = ["yellow", "pink", "blue", "green"];
const SIZES = { S: 2, M: 4, L: 9 };
const DRAW_TOOLS = ["pen", "marker", "line", "arrow", "rect", "ellipse", "text"];
const SHAPES = ["line", "arrow", "rect", "ellipse"];
const isDomKind = k => k === "note" || k === "text";

const $ = id => document.getElementById(id);
const stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d"), domEl = $("dom"), cursorsEl = $("cursors"), selDel = $("selDel");
const dpr = () => devicePixelRatio || 1;
let tool = "pen", ink = "ink", noteColor = "yellow", size = "M";
let view = { x: 0, y: 0, z: 1 };
const items = new Map();          // id -> item
const domEls = new Map();         // id -> element for notes and text
const remoteDrafts = new Map();   // id -> { d, t } lines other people are drawing right now
let mode = "connecting";          // connecting | shared | offline
let draft = null, selected = null, drag = null, resizing = null;
let lastWorld = null;             // last pointer position on the board
const undoStack = [], redoStack = [];

/* ---------- theme colours, read once per theme ---------- */
let pal = {};
const css = n => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();
function refreshPalette() {
  pal = { bg: css("bg"), dot: css("dot"), sel: css("sel"), line: css("line"), noteFg: css("note-fg"), hand: css("f-hand") };
  for (const k of INKS) pal[k] = css(k);
  for (const k of NOTE_COLORS) pal["note-" + k] = css("note-" + k);
  touched();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refreshPalette);
new MutationObserver(refreshPalette).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- toolbar ---------- */
const styleBar = $("style");
function renderStyleBar() {
  const isNote = tool === "note";
  const show = isNote || DRAW_TOOLS.includes(tool);
  styleBar.hidden = !show;
  if (!show) return;
  styleBar.innerHTML = "";
  (isNote ? NOTE_COLORS : INKS).forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-label", "Цвет " + c);
    b.className = (isNote ? noteColor : ink) === c ? "on" : "";
    b.innerHTML = `<span class="sw" style="background:var(--${isNote ? "note-" + c : c})"></span>`;
    b.onclick = () => { if (isNote) noteColor = c; else ink = c; restyleSelected(); renderStyleBar(); };
    styleBar.appendChild(b);
  });
  if (!isNote) {
    const s = document.createElement("span"); s.className = "sep"; styleBar.appendChild(s);
    Object.keys(SIZES).forEach(k => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "sz" + (size === k ? " on" : ""); b.title = { S: "Тонкая", M: "Средняя", L: "Толстая" }[k];
      b.setAttribute("aria-label", b.title);
      const d = { S: 4, M: 7, L: 11 }[k];
      b.innerHTML = `<span class="szdot" style="width:${d}px;height:${d}px"></span>`;
      b.onclick = () => { size = k; restyleSelected(); renderStyleBar(); };
      styleBar.appendChild(b);
    });
  }
}
function cursorFor(t) { return { pan: "grab", select: "default", note: "copy", text: "text", erase: "cell" }[t] || "crosshair"; }
function setTool(t) {
  tool = t;
  if (t !== "select") select(null);
  document.querySelectorAll("[data-tool]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tool === t)));
  stage.style.cursor = cursorFor(t);
  renderStyleBar();
}
document.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));

/* ---------- geometry ---------- */
const toWorld = (cx, cy) => ({ x: (cx - view.x) / view.z, y: (cy - view.y) / view.z });
const r1 = v => Math.round(v * 10) / 10;
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
const boxCache = new WeakMap();
function bbox(it, id) {
  if (isDomKind(it.kind)) {
    const el = domEls.get(id);
    return { x: it.x, y: it.y, X: it.x + (el ? el.offsetWidth : 190), Y: it.y + (el ? el.offsetHeight : 130) };
  }
  let b = boxCache.get(it);

/* ---------- connection ---------- */
